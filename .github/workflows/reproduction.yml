name: Reproduction engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.8
          uv sync --frozen
      - name: Check archive, readable code and aggregate arithmetic
        run: |
          uv run --frozen python reproduce.py doctor
          uv run --frozen python tools/check_readable.py
          uv run --frozen python verify_review.py
          uv run --frozen python tools/test_split_audit.py
      - name: Test original fitting and reporting pipeline on synthetic data
        run: uv run --frozen python reproduce.py smoke
      - name: Test checkpoint replay and reject corrupted outputs
        run: uv run --frozen python tools/test_replay.py
