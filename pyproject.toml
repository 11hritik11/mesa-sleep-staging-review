[project]
name = "mesa-sleep-staging-review"
version = "0.2.0"
description = "Reproduction runner for the archived RUN-006 MESA sleep-staging experiment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "torch==2.5.1",
  "scikit-learn==1.6.1",
  "matplotlib==3.9.4",
  "xgboost==2.1.4",
  "lightgbm==4.6.0",
  "catboost==1.2.8",
  "pyedflib==0.1.42",
  "joblib==1.5.3",
  "pandas==2.3.3",
  "wfdb==4.1.2",
]

[dependency-groups]
dev = ["black==25.1.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
